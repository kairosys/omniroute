apiVersion: v1
kind: Service
metadata:
  name: omniroute
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 20128
  selector:
    app: omniroute
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniroute
  labels:
    app: omniroute
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: omniroute
  template:
    metadata:
      labels:
        app: omniroute
    spec:
      containers:
        - name: omniroute
          image: diegosouzapw/omniroute:3.8.53
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 20128
              name: http
          startupProbe:
            httpGet:
              path: /healthz
              port: 20128
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: 20128
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: OMNIROUTE_MEMORY_MB
              value: "8192"
            - name: MODELS_CATALOG_PREFIX_MODE
              value: "canonical"
          resources:
            requests:
              cpu: "200m"
              memory: "5Gi"
            limits:
              cpu: "2"
              memory: "10Gi"
          volumeMounts:
            - name: omniroute-data
              mountPath: /app/data
      volumes:
        - name: omniroute-data
          hostPath:
            path: /mnt/workspaces/omniroute/data
            type: DirectoryOrCreate
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omniroute
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
spec:
  ingressClassName: nginx
  rules:
    - host: omniroute.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omniroute
                port:
                  number: 8080
